<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ania-avatar-vue · demo</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: radial-gradient(circle at 30% 0%, #1a1a3a, #080810);
        color: #e6e6f0;
        min-height: 100vh;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 20px;
      }
      h1 {
        background: linear-gradient(90deg, #a855f7, #ff1b8d, #00d9ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0;
      }
      button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #a855f7;
        background: #1a1a2e;
        color: #e6e6f0;
        cursor: pointer;
      }
      button:hover {
        background: #a855f7;
      }
      input {
        flex: 1;
        min-width: 240px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #333;
        background: #0e0e18;
        color: #e6e6f0;
      }
      .status {
        font-size: 13px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
